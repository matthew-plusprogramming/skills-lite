# Low-noise defect checks, warn mode (findings never fail a run). Pin the rule list
# explicitly: since Ruff 0.16 the default set is ~400 rules, and preview mode changes it again.
#   local: uvx ruff@0.17.6 check --exit-zero --statistics
#   CI:    uvx ruff@0.17.6 check --exit-zero --output-format github
# (--statistics cannot be combined with --output-format github: Ruff exits 2.)
# --exit-zero only covers findings: a bad config or a crash still exits 2, which should fail CI.
target-version = "py38"              # the documented minimum (README, install.sh); do not raise
extend-include = ["bin/agentloop"]   # extensionless script; Ruff skips it otherwise

[lint]
select = [
  "F",                               # pyflakes: unused/undefined names, duplicate keys
  "E711", "E722",                    # == None, bare except
  "B006", "B008", "B018",            # mutable default, call in default, useless expression
  "B009", "B010",                    # getattr/setattr with a constant name
  "T10",                             # debugger left in
  "PGH003",                          # blanket "type: ignore"
  "UP004", "UP008", "UP010", "UP032",  # object base, super(C, self), __future__, .format
  "RUF006", "RUF100",                # dangling asyncio task, unused noqa
]
# Not selected: whole "B" (B023 was 5/5 false in a trial); "B904" (every hit noise: 2 here, 4 on
# the split branches incl. 2 in the v1 fixture; each raise is UserError, printed by main());
# "BLE001"/"S110" (agentloop's fail-open catches are deliberate); "T20" (print is the CLI's
# output); "ERA001" (heuristic). Ruff checks syntax against py38 but not runtime APIs
# (e.g. dict | dict), so running the tests on 3.8 is what guards the minimum.
